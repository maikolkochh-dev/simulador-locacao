info:
  title: API fipeX
  description: |
    ## A API fipeX
    
    O fipeX é uma API REST que criei para oferecer acesso simples, rápido e gratuito aos dados de veículos da Tabela FIPE. A ideia é descomplicar a vida de desenvolvedores, curiosos e entusiastas de dados que precisam dessas informações.
    
    Os dados são atualizados mensalmente, direto da fonte, e armazenados em um banco de dados próprio para garantir a performance. A API foi construída com Protocol Buffers, o que a torna super eficiente, mas ela conversa com você via JSON, sem complicação.
    
    O FipeX nasceu como um projeto de hobby, um campo de testes que acabou se tornando algo maior. A filosofia é simples:

    - Dados Abertos e Acessíveis: Acredito que dados públicos devem ser fáceis de acessar. Por isso, tudo aqui é gratuito.
    - Sem Fins Lucrativos: Não há nenhuma monetização. O objetivo é puramente fornecer uma ferramenta útil para a comunidade.
    - Foco na Simplicidade: Sem anúncios, sem rastreadores invasivos, sem complicação. Apenas os dados que você precisa, de forma rápida.

    ⚠️ Aviso Importante: **Sem Vínculo com a FIPE**\
    É fundamental deixar isso 100% claro: o fipeX é um projeto independente e não possui qualquer tipo de vínculo, afiliação, parceria ou endosso da Fundação Instituto de Pesquisas Econômicas (FIPE).
    
    Eu apenas extraio os dados públicos que eles disponibilizam e os organizo de uma forma acessível através desta API. O fipeX não é, de forma alguma, um canal oficial da FIPE.
    
    ### Principais Funcionalidades
    
    - Dados Completos: Acesse marcas, modelos, preços e todo o histórico de períodos de referência.
    - Busca Inteligente: Uma pesquisa textual simples que te ajuda a encontrar o que precisa.
    - Filtros Avançados: Use múltiplos operadores para refinar suas buscas.
    - Paginação Consistente: Navegue por grandes volumes de dados de forma previsível.
    - Limite de Requisições Generoso: O limite padrão é de 10 requisições por segundo. Isso dá quase 26 milhões de requisições por mês, mais do que o suficiente para a maioria dos projetos.
    - CORS Aberto: A política de CORS é `*`, permitindo que você use a API diretamente no navegador sem dores de cabeça.

    ### Diretrizes de Uso (Como Usar)
    
    Para manter o serviço rápido e estável para todos, peço que siga algumas diretrizes simples:
    
    - **Não faça crawling da API**! Se você precisa do conjunto completo de dados, não há necessidade de sobrecarregar a API. Basta me pedir! Envie uma mensagem através do [formulário de contato](https://www.fipex.com.br/contato) e eu terei o prazer de te fornecer um dump completo do banco de dados.
    - Limite de Requisições: Mantenha suas chamadas dentro do limite de 10 por segundo. Se o seu projeto tem uma necessidade especial e precisa de mais, entre em contato para conversarmos.
    - Tamanho da Página: O número máximo de itens por página é 50.
    
    ## Paginação e Links

    Todos os endpoints de listagem suportam paginação consistente com os seguintes parâmetros:

    ### Parâmetros
    - `page`: Número da página (mínimo 1, padrão 1)
    - `limit`: Itens por página (1-50, padrão 10)

    Toda resposta paginada inclui:

    ```json
    {
      "data": [...],
      "pagination": {
        "total": 150,
        "limit": 10,
        "offset": 20,
        "page": 3,
        "pages": 15
      },
      "links": {
        "self": "https://api.fipex.com.br/v1/makes?page=3&limit=10",
        "next": "https://api.fipex.com.br/v1/makes?page=4&limit=10",
        "prev": "https://api.fipex.com.br/v1/makes?page=2&limit=10",
        "first": "https://api.fipex.com.br/v1/makes?page=1&limit=10",
        "last": "https://api.fipex.com.br/v1/makes?page=15&limit=10"
      }
    }
    ```

    ### Comportamento dos Links
    - `next` e `prev` são `null` quando não aplicáveis (primeira/última página).
    - Todos os parâmetros de query (filtros, ordenação) são preservados nos links.
    - Os links são URLs absolutas.

    ### Exemplos

    **Paginação básica:**
    ```
    GET /v1/makes?page=2&limit=20
    ```

    **Com filtros e ordenação:**
    ```
    GET /v1/makes?page=2&limit=20&order_by=name&filters[0].field=name&filters[0].op=CONTAINS&filters[0].value=honda
    ```

    ## Filtragem Avançada

    A API suporta filtragem avançada usando um formato de parâmetro estruturado que permite consultas complexas com múltiplos operadores.

    ### Formato do Parâmetro de Filtro

    Os filtros usam notação de array com três componentes obrigatórios:
    - `field`: O nome do campo a ser filtrado.
    - `op`: O operador do filtro.
    - `value`: O valor para filtrar.

    **Formato básico:**
    ```
    filters[INDEX].field=NOME_DO_CAMPO&filters[INDEX].op=OPERADOR&filters[INDEX].value=VALOR
    ```

    ### Operadores de Filtro Disponíveis

    | Operador | URL Encoded | Descrição | Exemplo de Valor |
    |:---|:---|:---|:---|
    | `=` | `=` | Igual a | `honda` |
    | `!=` | `!=` | Diferente de | `honda` |
    | `>` | `%3E` | Maior que | `2010` |
    | `<` | `%3C` | Menor que | `2020` |
    | `>=` | `%3E%3D` | Maior ou igual a | `2010` |
    | `<=` | `%3C%3D` | Menor ou igual a | `2020` |
    | `CONTAINS` | `CONTAINS` | String contém | `civic` |
    | `NOT CONTAINS` | `NOT%20CONTAINS` | String não contém | `civic` |
    | `IN` | `IN` | Valor está na lista | `honda,toyota,ford` |
    | `NOT IN` | `NOT%20IN` | Valor não está na lista | `honda,toyota` |
    | `TO` | `TO` | Entre (intervalo) | `2010,2020` |
    | `IS NULL` | `IS%20NULL` | Campo é nulo | (não precisa de valor) |

    ### Regras de Filtro por Campo

    Cada endpoint define quais campos podem ser filtrados e quais operadores são permitidos:

    #### Endpoint de Marcas (`/v1/makes`)
    - **id**: Campo UUID
      - Operadores: `=`, `!=`, `IN`, `NOT IN`
      - Validação: Deve ser um UUID v4 válido
    - **name**: Campo de texto
      - Operadores: `=`, `!=`, `CONTAINS`, `NOT CONTAINS`
      - Validação: 1-255 caracteres

    #### Endpoint de Modelos (`/v1/models`)
    - **id**: Campo UUID
      - Operadores: `=`, `!=`, `IN`, `NOT IN`
      - Validação: Deve ser um UUID v4 válido
    - **name**: Campo de texto
      - Operadores: `=`, `!=`, `CONTAINS`, `NOT CONTAINS`
      - Validação: 1-255 caracteres

    #### Endpoint de Busca (`/v1/search`)
    - **model**: Campo UUID (mapeia para model_id)
      - Operadores: `=`, `!=`, `IN`, `NOT IN`
    - **make**: Campo UUID (mapeia para make_id)
      - Operadores: `=`, `!=`, `IN`, `NOT IN`
    - **fuel**: Campo UUID (mapeia para fuel_id)
      - Operadores: `=`, `!=`, `IN`, `NOT IN`
    - **type**: Campo UUID (mapeia para type_id)
      - Operadores: `=`, `!=`, `IN`, `NOT IN`
    - **year**: Campo de ano
      - Operadores: `=`, `!=`, `>`, `<`, `>=`, `<=`, `IN`, `TO`
      - Validação: 1980-ano atual ou "zero" para veículos 0km.
    - **price**: Campo de preço (mapeia para latest_market_price_cents)
      - Operadores: `>`, `<`, `>=`, `<=`, `TO`
      - Processamento: Convertido automaticamente de moeda para centavos (multiplicado por 100).

    #### Endpoint de Períodos de Referência (`/v1/reference-periods`)
    - **year**: Campo de ano
      - Operadores: `=`, `!=`, `>`, `<`, `>=`, `<=`, `IN`, `NOT IN`, `TO`
      - Validação: 2001-ano atual
    - **month**: Campo de mês
      - Operadores: `=`, `!=`, `>`, `<`, `>=`, `<=`, `IN`, `NOT IN`, `TO`
      - Validação: 1-12

    ### Exemplos

    **Filtro único (ano maior que 2010):**
    ```
    GET /v1/search?filters[0].field=year&filters[0].op=%3E&filters[0].value=2010
    ```

    **Múltiplos filtros (ano > 2010 E preço entre 20000-50000):**
    ```
    GET /v1/search?filters[0].field=year&filters[0].op=%3E&filters[0].value=2010&filters[1].field=price&filters[1].op=TO&filters[1].value=20000,50000
    ```

    **Operador IN (múltiplas marcas):**
    ```
    GET /v1/search?filters[0].field=make&filters[0].op=IN&filters[0].value=uuid1,uuid2,uuid3
    ```

    ### Tratamento de Valores Especiais

    #### Casos Especiais do Campo `year`
    O campo `year` suporta o valor especial `"zero"` para representar veículos zero-quilômetro (0km):

    - **Igualdade**: `year=zero` encontra apenas veículos 0km.
    - **Intervalo com zero**: `year TO 2020,zero` encontra veículos de 2020 ou 0km.
    - **IN com zero**: `year IN 2020,2021,zero` encontra veículos de 2020, 2021 ou 0km.

    #### Processamento do Campo `price`
    Valores de preço são convertidos automaticamente de moeda para centavos:
    - Entrada: `25000.50` → Armazenado como: `2500050` (centavos)
    - Esta conversão acontece automaticamente para todos os filtros de preço.

    ### Tratamento de Erros

    Filtros inválidos retornam erros de validação estruturados:

    ```json
    {
      "correlation_id": "req-12345",
      "errors": [
        {
          "code": "VALIDATION_ERROR",
          "message": "o campo 'campo_invalido' não é um campo de filtro válido",
          "target": "filters[0].field"
        }
      ]
    }
    ```

    ## Ordenação e Classificação

    A maioria dos endpoints de listagem suporta ordenação flexível com múltiplas opções de sintaxe.

    ### Formatos do Parâmetro de Ordenação

    #### 1. Campo Único
    ```
    ?order_by=name          # Ascendente
    ?order_by=-name         # Descendente (prefixo com -)
    ```

    #### 2. Separado por Vírgula
    ```
    ?order_by=name,-price   # Nome ascendente, depois preço descendente
    ```

    #### 3. Notação de Array
    ```
    ?order_by[]=name&order_by[]=-price
    ```

    ### Campos de Ordenação Disponíveis por Endpoint

    #### Endpoint de Marcas (`/v1/makes`)
    - **name**: Ordena pelo nome da marca (padrão: ascendente).

    #### Endpoint de Modelos (`/v1/models`)
    - **name**: Ordena pelo nome do modelo (padrão: ascendente).

    #### Endpoint de Busca (`/v1/search`)
    - **year**: Ordena pelo ano do veículo.
    - **model**: Ordena pelo nome do modelo.
    - **make**: Ordena pelo nome da marca.
    - **price**: Ordena pelo preço (padrão: ascendente).
    - **type**: Ordena pelo nome do tipo de veículo.
    - **fuel**: Ordena pelo nome do combustível.

    #### Endpoint de Períodos de Referência (`/v1/reference-periods`)
    - **year**: Ordena pelo ano (padrão: descendente).
    - **month**: Ordena pelo mês (padrão: descendente).

    ### Ordenação Padrão

    Quando nenhuma ordenação é especificada, os endpoints usam padrões sensatos:
    - **Marcas/Modelos**: Ordem alfabética por nome (ascendente).
    - **Busca**: Por preço (ascendente).
    - **Períodos de Referência**: Por ano e mês (ambos descendentes, os mais novos primeiro).

    ### Exemplos

    **Ordenação básica:**
    ```
    GET /v1/makes?order_by=name           # Ascendente
    GET /v1/makes?order_by=-name          # Descendente
    ```

    **Múltiplos campos:**
    ```
    GET /v1/search?order_by=make,year,-price    # Marca asc, ano asc, preço desc
    ```
    
    ## Protocol Buffers
    - Arquivo proto: https://api.fipex.com.br/v1/assets/schema.proto
    - Definições TypeScript:
      - https://api.fipex.com.br/v1/assets/v1/schema.ts
      - https://api.fipex.com.br/v1/assets/google/protobuf/timestamp.ts
      - https://api.fipex.com.br/v1/assets/google/protobuf/wrappers.ts
    
    ### Estrutura de diretórios sugerida para projetos TypeScript
    ```
    ├── src
    │   ├── api
    │   │   ├── v1
    │   │   │   ├── schema.ts
    │   │   ├── google
    │   │   │   ├── protobuf
    │   │   │   │   ├── timestamp.ts
    │   │   │   │   ├── wrappers.ts
    ```

    ## Tipos de Conteúdo
    A API suporta respostas em JSON e Protocol Buffers:
    - `Accept: application/json` - Retorna JSON (padrão).
    - `Accept: application/protobuf` - Retorna Protocol Buffers.
    
    ## Guia: Cliente API FIPEX com Axios e Protocol Buffers
    
    Este guia demonstra como fazer requisições para a API oficial do FIPEX (https://api.fipex.com.br/v1/) usando Axios e Protocol Buffers em TypeScript, utilizando os schemas protobuf já existentes no projeto.
    
    ## Configuração do Cliente
    
    ### 1. Configuração Básica do Axios
    
    ```typescript
    import axios, { type AxiosError, type AxiosRequestConfig, type AxiosResponse } from 'axios';
    import type { BinaryReader, BinaryWriter } from '@bufbuild/protobuf/wire';
    import { ApiError, ErrorObject } from '@/well-known/v1/schema';
    
    // Interface para funções protobuf geradas
    interface TsProtoMessageFns<T> {
      encode(message: T, writer?: BinaryWriter): BinaryWriter;
      decode(input: BinaryReader | Uint8Array, length?: number): T;
      toJSON?(message: T): unknown;
    }
    
    // Cliente Axios configurado para protobuf
    const apiClient = axios.create({
      baseURL: 'https://api.fipex.com.br/v1',
      headers: {
        Accept: 'application/protobuf',
        'Content-Type': 'application/json',
      },
      responseType: 'arraybuffer',
      timeout: 30000,
    });
    ```
    
    ### 2. Interceptador de Resposta com Tratamento de Erro
    
    ```typescript
    apiClient.interceptors.response.use(
      (response: AxiosResponse<ArrayBuffer>) => response,
      (error: AxiosError<ArrayBuffer | unknown>) => {
        if (error.response) {
          console.log(`Erro da API: Status ${error.response.status} em ${error.config?.method?.toUpperCase()} ${error.config?.url}`);
    
          if (error.response.data instanceof ArrayBuffer && ApiError.decode) {
            try {
              const decodedError = ApiError.decode(new Uint8Array(error.response.data));
              console.log('Erro decodificado da API:', decodedError);
              return Promise.reject(decodedError);
            } catch (parseError) {
              console.log('Falha ao decodificar erro protobuf:', parseError);
            }
          }
        } else if (error.request) {
          console.log('Erro de rede: Nenhuma resposta recebida.', error.message);
        } else {
          console.log('Erro de configuração da requisição:', error.message);
        }
        return Promise.reject(error);
      }
    );
    ```
    
    ## Função Principal para Requisições
    
    ### 3. Tipos e Interfaces
    
    ```typescript
    interface MakeProtoRequestOptions<RequestProto, ResponseProto> {
      url: string;
      httpMethod?: 'GET' | 'POST' | 'PUT' | 'DELETE' | 'PATCH';
      requestProto?: RequestProto | null;
      requestType?: TsProtoMessageFns<RequestProto> | null;
      responseType: TsProtoMessageFns<ResponseProto>;
      signal?: AbortSignal;
      params?: Record<string, unknown>;
    }
    
    interface MakeProtoRequestResult<ResponseProto> {
      response: ResponseProto;
      duration: number;
    }
    ```
    
    ### 4. Função de Requisição
    
    ```typescript
    async function makeProtoRequest<RequestProto, ResponseProto>(
      options: MakeProtoRequestOptions<RequestProto, ResponseProto>,
    ): Promise<MakeProtoRequestResult<ResponseProto>> {
      const {
        url,
        httpMethod = 'GET',
        requestProto = null,
        requestType = null,
        responseType,
        signal,
        params = {},
      } = options;
    
      const startTime = performance.now();
    
      try {
        const config: AxiosRequestConfig = {
          headers: { Accept: 'application/protobuf' },
          method: httpMethod,
          params,
          signal,
          url,
        };
    
        if (
          requestProto &&
          requestType &&
          ['POST', 'PUT', 'PATCH'].includes(httpMethod)
        ) {
          config.data = requestType.encode(requestProto).finish();
          if (!config.headers) {
            config.headers = {};
          }
          config.headers['Content-Type'] = 'application/protobuf';
        }
    
        const axiosResponse = await apiClient.request<ArrayBuffer>(config);
        const endTime = performance.now();
        const duration = endTime - startTime;
    
        const decodedResponse = responseType.decode(new Uint8Array(axiosResponse.data));
    
        console.log(`Requisição para ${url} completada em ${duration.toFixed(2)}ms`);
        console.log('Resposta decodificada:', responseType.toJSON ? responseType.toJSON(decodedResponse) : decodedResponse);
    
        return {
          duration: Number.parseFloat(duration.toFixed(2)),
          response: decodedResponse,
        };
      } catch (error) {
        console.log('Erro na requisição:', error);
    
        // Se o erro já foi processado pelo interceptador, ele será um ApiError
        if (typeof (error as any)?.errors !== 'undefined') {
          throw error as ApiError;
        }
    
        // Criar um ApiError genérico para erros não tratados
        throw ApiError.create({
          correlation_id: 'client-error',
          errors: [
            ErrorObject.create({
              code: 3, // INTERNAL_SERVER_ERROR
              message: `Erro inesperado: ${error instanceof Error ? error.message : 'Erro desconhecido'}`,
              target: url,
            }),
          ],
        });
      }
    }
    ```
    
    ## Exemplo Prático: Buscar Tipos de Veículos
    
    ### 5. Importações e Uso dos Schemas
    
    ```typescript
    import { ListVehicleTypesResponse } from '@/well-known/v1/schema';
    
    // Função para buscar tipos de veículos disponíveis
    async function buscarTiposDeVeiculos(): Promise<ListVehicleTypesResponse> {
      try {
        console.log('Iniciando busca por tipos de veículos...');
    
        const resultado = await makeProtoRequest<never, ListVehicleTypesResponse>({
          url: '/types',
          httpMethod: 'GET',
          responseType: ListVehicleTypesResponse,
          params: {
            limit: 50,
            offset: 0
          }
        });
    
        console.log(`Encontrados ${resultado.response.data.length} tipos de veículos`);
        console.log('Tipos disponíveis:', resultado.response.data.map(type => ({
          id: type.id,
          nome: type.name,
          slug: type.slug
        })));
    
        return resultado.response;
    
      } catch (error) {
        if (error instanceof Error && 'errors' in error) {
          const apiError = error as ApiError;
          console.log(`Erro da API (${apiError.correlation_id}):`, apiError.errors);
    
          apiError.errors.forEach(err => {
            console.log(`- ${err.message} (código: ${err.code})`);
          });
        } else {
          console.log('Erro inesperado:', error);
        }
    
        throw error;
      }
    }
    ```
    
    ### 6. Exemplo de Uso Completo
    
    ```typescript
    // Função principal de exemplo
    async function exemploCompleto(): Promise<void> {
      try {
        // 1. Buscar tipos de veículos
        const tiposVeiculos = await buscarTiposDeVeiculos();
    
        // 2. Mostrar os resultados
        console.log('=== TIPOS DE VEÍCULOS DISPONÍVEIS ===');
        tiposVeiculos.data.forEach((tipo, index) => {
          console.log(`${index + 1}. ${tipo.name} (ID: ${tipo.id})`);
        });
    
        // 3. Informações de paginação
        if (tiposVeiculos.pagination) {
          console.log(`\nPaginação: ${tiposVeiculos.pagination.page}/${tiposVeiculos.pagination.pages}`);
          console.log(`Total de registros: ${tiposVeiculos.pagination.total}`);
        }
    
        // 4. Links de navegação
        if (tiposVeiculos.links) {
          console.log('\nLinks disponíveis:');
          console.log(`- Própria página: ${tiposVeiculos.links.self}`);
          if (tiposVeiculos.links.next) {
            console.log(`- Próxima página: ${tiposVeiculos.links.next}`);
          }
          if (tiposVeiculos.links.prev) {
            console.log(`- Página anterior: ${tiposVeiculos.links.prev}`);
          }
        }
    
      } catch (error) {
        console.log('Falha ao buscar dados da API FIPEX:', error);
      }
    }
    
    // Executar o exemplo
    exemploCompleto();
    ```
    
    ## Tratamento de Erros Específicos da API
    
    ### 7. Tratamento Avançado de Erros
    
    ```typescript
    function handleApiError(error: unknown): void {
      if (error && typeof error === 'object' && 'errors' in error) {
        const apiError = error as ApiError;
    
        console.log(`ID de Correlação: ${apiError.correlation_id}`);
        console.log('Erros encontrados:');
    
        apiError.errors.forEach((err, index) => {
          console.log(`\n${index + 1}. ${err.message}`);
          console.log(`   Código: ${err.code}`);
    
          if (err.target) {
            console.log(`   Campo/Alvo: ${err.target}`);
          }
    
          // Traduzir códigos de erro para mensagens mais amigáveis
          const errorMessages: Record<number, string> = {
            0: 'Erro não especificado',
            1: 'Recurso não encontrado',
            2: 'Entrada inválida',
            3: 'Erro interno do servidor',
            4: 'Conflito nos dados',
            5: 'Tipo de mídia não suportado',
            6: 'Erro de validação',
            7: 'Muitas requisições'
          };
    
          const friendlyMessage = errorMessages[err.code] || 'Erro desconhecido';
          console.log(`   Significado: ${friendlyMessage}`);
        });
      } else {
        console.log('Erro não relacionado à API:', error);
      }
    }
    
    // Exemplo de uso do tratamento de erro
    async function exemploComTratamentoDeErro(): Promise<void> {
      try {
        await buscarTiposDeVeiculos();
      } catch (error) {
        handleApiError(error);
      }
    }
    ```
    
    ## Considerações Importantes
    
    ### 8. Melhores Práticas
    
    ```typescript
    // Configuração de timeout e retry
    const configAvancada = {
      timeout: 10000, // 10 segundos
      maxRetries: 3,
      retryDelay: 1000, // 1 segundo entre tentativas
    };
    
    // Função com retry automático
    async function makeProtoRequestWithRetry<RequestProto, ResponseProto>(
      options: MakeProtoRequestOptions<RequestProto, ResponseProto>,
      retries: number = 3
    ): Promise<MakeProtoRequestResult<ResponseProto>> {
      let lastError: unknown;
    
      for (let attempt = 1; attempt <= retries; attempt++) {
        try {
          console.log(`Tentativa ${attempt}/${retries} para ${options.url}`);
          return await makeProtoRequest(options);
        } catch (error) {
          lastError = error;
    
          if (attempt < retries) {
            const delay = 1000 * attempt; // Delay progressivo
            console.log(`Falha na tentativa ${attempt}, tentando novamente em ${delay}ms...`);
            await new Promise(resolve => setTimeout(resolve, delay));
          }
        }
      }
    
      throw lastError;
    }
    ```
    
    ### 9. Cancelamento de Requisições
    
    ```typescript
    // Exemplo com cancelamento de requisição
    async function exemploComCancelamento(): Promise<void> {
      const controller = new AbortController();
    
      // Cancelar após 5 segundos
      const timeoutId = setTimeout(() => {
        console.log('Cancelando requisição por timeout...');
        controller.abort();
      }, 5000);
    
      try {
        const resultado = await makeProtoRequest<never, ListVehicleTypesResponse>({
          url: '/types',
          httpMethod: 'GET',
          responseType: ListVehicleTypesResponse,
          signal: controller.signal
        });
    
        clearTimeout(timeoutId);
        console.log('Requisição completada com sucesso:', resultado.response);
    
      } catch (error) {
        clearTimeout(timeoutId);
    
        if ((error as Error).name === 'AbortError') {
          console.log('Requisição cancelada pelo usuário');
        } else {
          console.log('Erro na requisição:', error);
        }
      }
    }
    ```




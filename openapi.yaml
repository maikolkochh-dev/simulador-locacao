  /v1/search:
    get:
      tags:
        - Busca
      summary: Buscar veículos
      description: |
        Busca de texto completo por veículos usando Meilisearch com filtros e ordenação avançados.

        **Filtros Disponíveis:**
        - `model`: Filtro por UUID do modelo com operadores `=`, `!=`, `IN`, `NOT IN`.
        - `make`: Filtro por UUID da marca com operadores `=`, `!=`, `IN`, `NOT IN`.
        - `fuel`: Filtro por UUID do combustível com operadores `=`, `!=`, `IN`, `NOT IN`.
        - `type`: Filtro por UUID do tipo de veículo com operadores `=`, `!=`, `IN`, `NOT IN`.
        - `year`: Filtro de ano com operadores `=`, `!=`, `>`, `<`, `>=`, `<=`, `IN`, `TO` (suporta "zero" para veículos 0km).
        - `price`: Filtro de preço com operadores `>`, `<`, `>=`, `<=` (convertido automaticamente para centavos).

        **Ordenação:**
        - `year`: Ordena pelo ano.
        - `model`: Ordena pelo nome do modelo.
        - `make`: Ordena pelo nome da marca.
        - `price`: Ordena pelo preço (padrão: ascendente).
        - `type`: Ordena pelo nome do tipo de veículo.
        - `fuel`: Ordena pelo nome do combustível.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OrderByParam'
        - name: q
          in: query
          description: Termo de busca.
          schema:
            type: string
        - name: model_id
          in: query
          description: Filtra pelo UUID do modelo.
          schema:
            type: string
            format: uuid
        - name: make_id
          in: query
          description: Filtra pelo UUID da marca.
          schema:
            type: string
            format: uuid
        - name: fuel_id
          in: query
          description: Filtra pelo UUID do combustível.
          schema:
            type: string
            format: uuid
        - name: type_id
          in: query
          description: Filtra pelo UUID do tipo de veículo.
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/FiltersParam'
      responses:
        '200':
          description: Resultados da busca obtidos com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'


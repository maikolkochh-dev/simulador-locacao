  /v1/prices:
    get:
      tags:
        - Preços
      summary: Encontrar preço do veículo
      description: |
        Encontra um preço de veículo específico fornecendo ou o ID do modelo + ID do combustível, ou o slug do modelo + slug do combustível.

        **Parâmetros Obrigatórios (escolha uma combinação):**
        - `model_id` + `fuel_id` + `year`
        - `model_slug` + `fuel_acronym` + `year`

        **Parâmetros Opcionais:**
        - `ref_id`: UUID de um período de referência específico.
        - `ref_date`: Data de referência no formato AAAA-MM-DD.
      parameters:
        - name: model_id
          in: query
          description: UUID do modelo (obrigatório sem model_slug).
          schema:
            type: string
            format: uuid
        - name: fuel_id
          in: query
          description: UUID do combustível (obrigatório com model_id).
          schema:
            type: string
            format: uuid
        - name: model_slug
          in: query
          description: Slug do modelo (obrigatório sem model_id).
          schema:
            type: string
            pattern: '^[a-z0-9-]+$'
        - name: fuel_acronym
          in: query
          description: Slug do combustível (obrigatório com model_slug).
          schema:
            type: string
            pattern: '^[a-z0-9-]+$'
        - name: year
          in: query
          required: true
          description: Ano do veículo (1980-ano atual ou "zero" para 0km).
          schema:
            oneOf:
              - type: integer
                minimum: 1980
                maximum: 2025
              - type: string
                enum: [ "zero" ]
        - name: ref_id
          in: query
          description: UUID do período de referência.
          schema:
            type: string
            format: uuid
        - name: ref_date
          in: query
          description: Data de referência (AAAA-MM-DD).
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Preço encontrado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPriceResponse'


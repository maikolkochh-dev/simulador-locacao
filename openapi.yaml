  /v1/prices/compare:
    get:
      tags:
        - Preços
        - Comparação
      summary: Comparar preços de veículos
      description: |
        Compara preços entre múltiplos veículos usando um formato específico.

        **Formato de Especificação do Veículo:**
        Cada veículo é especificado como: `slug-do-modelo,slug-do-combustivel,ano`
        Múltiplos veículos são separados por ponto e vírgula (`;`, ou `%3B` em percent encoding).

        **Exemplo:**
        `vehicle_specs=850-glt-2-5-20v,g,1997;850-glt-2-5-20v,g,1996;850-glt-2-5-20v,g,1995;850-glt-2-5-20v,g,1994;850-glt-2-5-20v,g,1993;850-glt-2-5-20v,g,1992`
      parameters:
        - name: vehicle_specs
          in: query
          required: true
          description: Especificações de veículos separadas por vírgula no formato "slug-do-modelo,slug-do-combustivel,ano".
          schema:
            type: string
            pattern: '^[0-9a-z-]+,[0-9a-z-]+,(zero|\d{4})(;[0-9a-z-]+,[0-9a-z-]+,(zero|\d{4}))*$'
          example: "850-glt-2-5-20v,g,1997;850-glt-2-5-20v,g,1996;850-glt-2-5-20v,g,1995;850-glt-2-5-20v,g,1994;850-glt-2-5-20v,g,1993;850-glt-2-5-20v,g,1992"
      responses:
        '200':
          description: Comparação de preços obtida com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompareVehiclePricesResponse'


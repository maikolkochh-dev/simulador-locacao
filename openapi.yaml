    # Schemas de Erro
    ErrorObject:
      type: object
      properties:
        target:
          description: Campo ou parâmetro específico que causou o erro.
    ApiError:
      type: object
      properties:
        correlation_id:
          description: Identificador único da requisição para depuração.

  responses:
    ValidationError:
      description: Erro de validação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            correlation_id: "req-12345"
            errors:
              - code: "VALIDATION_ERROR"
                message: "o campo 'year' deve estar entre 1980 e 2025"
                target: "year"

    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            correlation_id: "req-12345"
            errors:
              - code: "NOT_FOUND"
                message: "não encontrado"

    TooManyRequests:
      description: Limite de requisições excedido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            correlation_id: "req-12345"
            errors:
              - code: "TOO_MANY_REQUESTS"
                message: "muitas requisições"

    InternalServerError:
      description: Erro interno do servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            correlation_id: "req-12345"
            errors:
              - code: "INTERNAL_SERVER_ERROR"
                message: "erro interno do servidor"

    UnsupportedMediaType:
      description: Tipo de mídia não suportado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            correlation_id: "req-12345"
            errors:
              - code: "UNSUPPORTED_MEDIA_TYPE"
                message: "tipo de mídia não suportado"

    Conflict:
      description: Expectativa conflitante
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            correlation_id: "req-12345"
            errors:
              - code: "CONFLICT"
                message: "expectativa conflitante"


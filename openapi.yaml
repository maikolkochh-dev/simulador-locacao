components:
  parameters:
    PageParam:
      name: page
      in: query
      description: Número da página (mínimo 1).
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1

    LimitParam:
      name: limit
      in: query
      description: Número de itens por página (1-50).
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
      example: 10

    OrderByParam:
      name: order_by
      in: query
      description: |
        Especificação de ordenação. Pode ser fornecida em múltiplos formatos:

        **Campo único:** `?order_by=name` (ascendente) ou `?order_by=-name` (descendente)

        **Separado por vírgula:** `?order_by=name,-price`

        **Notação de array:** `?order_by[]=name&order_by[]=-price`

        Use o prefixo `-` para ordem descendente.
      style: form
      explode: false
      schema:
        oneOf:
          - type: string
            example: "name"
          - type: array
            items:
              type: string
            example: [ "name", "-price" ]

    FiltersParam:
      name: filters
      in: query
      description: |
        Filtragem avançada usando notação de array. Cada filtro requer:
        - `field`: O campo a ser filtrado.
        - `op`: O operador (veja a seção Operadores de Filtro).
        - `value`: O valor para filtrar.

        **Formato:** `filters[0].field=year&filters[0].op=%3E&filters[0].value=2010`

        **Múltiplos filtros:** `filters[0].field=year&filters[0].op=%3E&filters[0].value=2010&filters[1].field=price&filters[1].op=TO&filters[1].value=20000,50000`

        **URL Encoding:** Caracteres especiais devem ser codificados na URL:
        - `>` se torna `%3E`
        - `<` se torna `%3C`
        - `>=` se torna `%3E%3D`
        - `<=` se torna `%3C%3D`
      style: deepObject
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/FilterExpression'

  schemas:
    # Schemas de resposta baseados nas definições protobuf
    # ... (propriedades não traduzidas conforme solicitado) ...
    YearOption:
      type: object
      properties:
        model_year:
          type: integer
          description: 'Ano do modelo (ex: 2020).'
        is_zero_km:
          type: boolean
          description: Indica se é um veículo zero km.

    ModelYearFuels:
      type: object
      properties:
        year_specifier:
          $ref: '#/components/schemas/YearSpecification'
        fuels:
          type: array
          items:
            $ref: '#/components/schemas/Fuel'

